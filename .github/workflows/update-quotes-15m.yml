name: Update Watchlist Quotes (Every 15m)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-sync
  cancel-in-progress: false

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest 15m quotes & Top-30 US Tech flash wire
        run: python3 scripts/fetch_market_data.py --mode quotes

      - name: Commit and push updated quotes & flash wire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json data/flash.json
          if git diff --staged --quiet; then
            echo "No quote or flash changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update 15m quotes & tech30 flash [skip ci]"
          git pull --rebase origin main
          git push origin main
