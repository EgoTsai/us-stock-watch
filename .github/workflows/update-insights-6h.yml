name: Update 6H Headlines & Netizen Sentiment

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
    # 10 minutes before US Market Open (09:20 AM ET) - EDT (UTC-4) & EST (UTC-5)
    - cron: "18 13 * * 1-5"
    - cron: "18 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-sync
  cancel-in-progress: false

jobs:
  update-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch 6H headlines, netizen sentiment & quotes
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE_CRON" = "18 13 * * 1-5" ] || [ "$SCHEDULE_CRON" = "18 14 * * 1-5" ]; then
            python3 scripts/fetch_market_data.py --mode all --preopen-check
          else
            python3 scripts/fetch_market_data.py --mode all
          fi

      - name: Commit and push updated insights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json data/insights.json data/flash.json
          if git diff --staged --quiet; then
            echo "No insight changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update 6h headlines & sentiment [skip ci]"
          git pull --rebase origin main
          git push origin main
